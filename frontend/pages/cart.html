<!doctype html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="stylesheet" href="../assets/css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <title>Giỏ hàng của bạn | EIU COMPUTER</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f3f4f6;
      color: #111827;
    }

    .container {
      max-width: 1000px;
      margin: 40px auto;
      background: #fff;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      border-radius: 10px;
      min-height: 400px;
    }

    h1 {
      margin-top: 0;
      font-size: 28px;
      color: #2563eb;
    }

    .cart-table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 20px;
    }

    .cart-table th,
    .cart-table td {
      padding: 16px;
      border-bottom: 1px solid #e5e7eb;
      text-align: left;
    }

    .cart-table th {
      background: #f9fafb;
      font-weight: 700;
      color: #6b7280;
    }

    .item-name {
      font-weight: 600;
      font-size: 16px;
    }

    .item-category {
      font-size: 13px;
      color: #6b7280;
      margin-top: 4px;
    }

    .total-row {
      text-align: right;
      font-size: 24px;
      font-weight: 800;
      color: #dc2626;
      margin-top: 24px;
      padding-top: 24px;
      border-top: 2px solid #e5e7eb;
    }

    .actions {
      margin-top: 30px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn {
      padding: 14px 24px;
      border: none;
      border-radius: 8px;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn-clear {
      background: #f3f4f6;
      color: #4b5563;
    }

    .btn-clear:hover {
      background: #e5e7eb;
    }

    .btn-checkout {
      background: #dc2626;
      color: white;
    }

    .btn-checkout:hover {
      background: #b91c1c;
    }

    .empty-cart {
      text-align: center;
      padding: 60px 20px;
      color: #6b7280;
    }

    .empty-cart i {
      font-size: 48px;
      margin-bottom: 16px;
      color: #d1d5db;
    }

    /* MODAL XÓA GIỎ HÀNG */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(4px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      opacity: 0;
      animation: fadeInModal 0.2s forwards;
    }

    .modal-box {
      background: #fff;
      width: 100%;
      max-width: 400px;
      border-radius: 16px;
      padding: 30px;
      text-align: center;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
      transform: scale(0.95);
      animation: scaleUpModal 0.2s forwards;
    }

    .modal-icon {
      width: 64px;
      height: 64px;
      background: #fee2e2;
      color: #dc2626;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      margin: 0 auto 20px;
    }

    .modal-box h3 {
      margin: 0 0 10px;
      font-size: 22px;
      color: #111827;
      font-weight: 800;
    }

    .modal-box p {
      margin: 0 0 24px;
      color: #6b7280;
      font-size: 15px;
      line-height: 1.6;
    }

    .modal-actions {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    .modal-actions .btn {
      flex: 1;
      padding: 12px 0;
      font-size: 15px;
    }

    @keyframes fadeInModal {
      to {
        opacity: 1;
      }
    }

    @keyframes scaleUpModal {
      to {
        transform: scale(1);
      }
    }

    /* CUSTOM CHECKBOX */
    .checkbox-cell {
      width: 50px;
      text-align: center;
    }

    .custom-checkbox {
      width: 20px;
      height: 20px;
      cursor: pointer;
      accent-color: #dc2626;
    }

    .custom-checkbox:hover {
      transform: scale(1.1);
    }
  </style>
</head>

<body>
  <div id="header"></div>

  <div class="container">
    <h1><i class="fa-solid fa-cart-shopping"></i> GIỎ HÀNG CỦA BẠN</h1>
    <div id="cartContent"></div>
  </div>

  <div id="footer"></div>

  <div id="clear-cart-modal" class="modal-overlay" style="display: none;">
    <div class="modal-box">
      <div class="modal-icon">
        <i class="fa-solid fa-triangle-exclamation"></i>
      </div>
      <h3>Xóa toàn bộ giỏ hàng?</h3>
      <p>Bạn có chắc chắn muốn xóa tất cả sản phẩm khỏi giỏ hàng? Hành động này không thể hoàn tác.</p>
      <div class="modal-actions">
        <button class="btn btn-clear" onclick="closeClearModal()">Hủy bỏ</button>
        <button class="btn btn-checkout" onclick="executeClearCart()">Đồng ý Xóa</button>
      </div>
    </div>
  </div>

  <script src="../components/header.js"></script>
  <script src="../components/footer.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  <script>
    renderHeader("header");
    renderFooter("footer");

    const PARTS = {
      cpu: "Bộ vi xử lý", main: "Bo mạch chủ", ram: "RAM", ssd: "SSD",
      hdd: "HDD", vga: "VGA", psu: "Nguồn", case: "Vỏ case",
      monitor: "Màn hình", keyboard: "Bàn phím", mouse: "Chuột",
      headset: "Tai nghe", fan: "Fan case", aircool: "Tản nhiệt khí",
      aio: "Tản nhiệt nước AIO", custom: "Tản nhiệt nước Custom", windows: "Windows"
    };

    function loadCart() {
      const cartContent = document.getElementById("cartContent");

      let buildCart = JSON.parse(localStorage.getItem("pc_build")) || {};
      let regularCart = JSON.parse(localStorage.getItem("cart")) || [];
      let regularItems = Array.isArray(regularCart) ? regularCart : Object.values(regularCart);

      const hasBuildItems = Object.keys(buildCart).length > 0;
      const hasRegularItems = regularItems.length > 0;

      if (!hasBuildItems && !hasRegularItems) {
        cartContent.innerHTML = `
          <div class="empty-cart">
            <i class="fa-solid fa-cart-arrow-down"></i>
            <h2>Giỏ hàng đang trống</h2>
            <p>Bạn chưa có sản phẩm nào trong giỏ hàng. Hãy quay lại cửa hàng để mua sắm nhé!</p>
            <a href="index.html" class="btn btn-checkout" style="display:inline-block; margin-top:16px; text-decoration:none;">Quay lại Trang chủ</a>
          </div>
        `;
        return;
      }

      let html = `
        <table class="cart-table">
          <thead>
            <tr>
              <th class="checkbox-cell">
                <input type="checkbox" id="check-all" class="custom-checkbox" checked onchange="toggleAll(this)">
              </th>
              <th>Sản phẩm</th>
              <th style="text-align: center;">Số lượng</th>
              <th style="text-align: right;">Đơn giá</th>
              <th style="text-align: right;">Thành tiền</th>
            </tr>
          </thead>
          <tbody>
      `;

      // Render Cấu hình Build PC
      for (const key in buildCart) {
        const item = buildCart[key];
        const qty = Number(item.qty || 1);
        const price = Number(item.price || 0);
        const lineTotal = price * qty;
        const categoryName = PARTS[key] || "Linh kiện PC";

        html += `
          <tr>
            <td class="checkbox-cell">
              <input type="checkbox" class="custom-checkbox item-check" value="${item.id}" data-source="build" data-key="${key}" data-price="${price}" data-qty="${qty}" checked onchange="calculateTotal()">
            </td>
            <td>
              <div class="item-name">${item.name}</div>
              <div class="item-category">${categoryName} (Từ cấu hình ráp máy)</div>
            </td>
            <td style="text-align: center;">${qty}</td>
            <td style="text-align: right;">${price.toLocaleString("vi-VN")} đ</td>
            <td style="text-align: right; font-weight: bold; color: #dc2626;">${lineTotal.toLocaleString("vi-VN")} đ</td>
          </tr>
        `;
      }

      // Render Mua lẻ
      regularItems.forEach((item, index) => {
        const qty = Number(item.qty || item.quantity || 1);
        const price = Number(item.price || 0);
        const lineTotal = price * qty;

        html += `
          <tr>
            <td class="checkbox-cell">
              <input type="checkbox" class="custom-checkbox item-check" value="${item.id}" data-source="regular" data-index="${index}" data-price="${price}" data-qty="${qty}" checked onchange="calculateTotal()">
            </td>
            <td>
              <div class="item-name">${item.name || 'Sản phẩm'}</div>
              <div class="item-category">Mua lẻ</div>
            </td>
            <td style="text-align: center;">${qty}</td>
            <td style="text-align: right;">${price.toLocaleString("vi-VN")} đ</td>
            <td style="text-align: right; font-weight: bold; color: #dc2626;">${lineTotal.toLocaleString("vi-VN")} đ</td>
          </tr>
        `;
      });

      html += `
          </tbody>
        </table>
        
        <div class="total-row" id="total-display">
          TỔNG THANH TOÁN: 0 đ
        </div>

        <div class="actions">
          <button class="btn btn-clear" onclick="clearCart()">
            <i class="fa-solid fa-trash"></i> Xóa giỏ hàng
          </button>
          <button class="btn btn-checkout" onclick="checkout()" id="btn-checkout">
            Xác nhận & Đi đến Thanh toán <i class="fa-solid fa-arrow-right"></i>
          </button>
        </div>
      `;

      cartContent.innerHTML = html;
      calculateTotal();
    }

    function toggleAll(source) {
      const checkboxes = document.querySelectorAll('.item-check');
      checkboxes.forEach(cb => cb.checked = source.checked);
      calculateTotal();
    }

    function calculateTotal() {
      const checkboxes = document.querySelectorAll('.item-check');
      let total = 0;
      let allChecked = true;
      let anyChecked = false;

      checkboxes.forEach(cb => {
        if (cb.checked) {
          const price = Number(cb.getAttribute('data-price'));
          const qty = Number(cb.getAttribute('data-qty'));
          total += (price * qty);
          anyChecked = true;
        } else {
          allChecked = false;
        }
      });

      const checkAll = document.getElementById('check-all');
      if (checkAll) checkAll.checked = allChecked && checkboxes.length > 0;

      const totalDisplay = document.getElementById('total-display');
      if (totalDisplay) totalDisplay.innerHTML = `TỔNG THANH TOÁN: ${total.toLocaleString("vi-VN")} đ`;

      const btnCheckout = document.getElementById('btn-checkout');
      if (btnCheckout) {
        btnCheckout.disabled = !anyChecked;
        btnCheckout.style.opacity = anyChecked ? "1" : "0.5";
        btnCheckout.style.cursor = anyChecked ? "pointer" : "not-allowed";
      }
    }

    function clearCart() {
      document.getElementById('clear-cart-modal').style.display = 'flex';
    }

    function closeClearModal() {
      document.getElementById('clear-cart-modal').style.display = 'none';
    }

    function executeClearCart() {
      localStorage.removeItem("pc_build");
      localStorage.removeItem("cart");
      localStorage.removeItem("cartItems");
      closeClearModal();
      loadCart();
      if (typeof updateCartCount === "function") updateCartCount();
      renderHeader("header");
    }

    // ==========================================
    // HÀM CHUẨN BỊ DỮ LIỆU VÀ CHUYỂN SANG TRANG THANH TOÁN (PAYMENT INFO)
    // ==========================================
    // TRONG FILE CART.HTML
    async function checkout() {
      const token = localStorage.getItem('token');
      if (!token) return Swal.fire('Khoan đã!', 'Vui lòng đăng nhập.', 'warning').then(() => window.location.href = "auth.html");

      const checkedBoxes = document.querySelectorAll('.item-check:checked');
      if (checkedBoxes.length === 0) return Swal.fire('Opps!', 'Vui lòng chọn sản phẩm!', 'info');

      // (Đoạn lấy buildCart, regularCart và tính totalAmount giữ nguyên của ông...)
      let buildCart = JSON.parse(localStorage.getItem("pc_build")) || {};
      let regularCart = JSON.parse(localStorage.getItem("cart")) || [];
      let regularItems = Array.isArray(regularCart) ? regularCart : Object.values(regularCart);
      let cartItems = [];
      let totalAmount = 0;

      checkedBoxes.forEach(cb => {
        const source = cb.getAttribute('data-source');
        const qty = Number(cb.getAttribute('data-qty'));
        const price = Number(cb.getAttribute('data-price'));

        if (source === 'build') {
          const key = cb.getAttribute('data-key');
          if (buildCart[key]) { cartItems.push({ id: buildCart[key].id, name: buildCart[key].name, price: buildCart[key].price, qty: qty, image: buildCart[key].image, category: key }); totalAmount += (price * qty); }
        } else if (source === 'regular') {
          const index = cb.getAttribute('data-index');
          if (regularItems[index]) { cartItems.push({ id: regularItems[index].id, name: regularItems[index].name, price: regularItems[index].price, qty: qty, image: regularItems[index].image, category: regularItems[index].category }); totalAmount += (price * qty); }
        }
      });

      const btnCheckout = document.getElementById('btn-checkout');
      btnCheckout.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Đang tạo hóa đơn...';
      btnCheckout.disabled = true;

      try {
        // GỌI API TẠO ĐƠN HÀNG (TRỪ KHO LUÔN)
        const response = await fetch('http://localhost:3000/api/orders/checkout', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${token}` },
          body: JSON.stringify({ cartItems: cartItems, totalAmount: totalAmount })
        });
        const data = await response.json();

        if (response.ok) {
          // Xóa những món đã mua khỏi Giỏ hàng cục bộ
          checkedBoxes.forEach(cb => {
            if (cb.getAttribute('data-source') === 'build') delete buildCart[cb.getAttribute('data-key')];
            else regularItems[cb.getAttribute('data-index')] = null;
          });
          regularItems = regularItems.filter(item => item !== null);
          localStorage.setItem("pc_build", JSON.stringify(buildCart));
          localStorage.setItem("cart", JSON.stringify(regularItems));

          // BAY SANG TRANG PAYMENT-INFO VỚI MÃ ĐƠN
          window.location.href = `payment-info.html?code=${data.order_code}`;
        } else {
          Swal.fire('Lỗi', data.message, 'error');
          btnCheckout.innerHTML = 'Xác nhận & Đi đến Thanh toán'; btnCheckout.disabled = false;
        }
      } catch (error) {
        Swal.fire('Lỗi', 'Mất kết nối máy chủ', 'error');
        btnCheckout.innerHTML = 'Xác nhận & Đi đến Thanh toán'; btnCheckout.disabled = false;
      }
    }
    loadCart();
  </script>
</body>

</html>
